# Staging hosts (included from /etc/nginx/nginx.conf). Reachable only through the Cloudflare tunnel.
# Every request must carry the Cloudflare Access assertion header: without Access in front, staging
# answers 403 (defense in depth; Cloudflare validates the identity at the edge).
upstream staging_customer_web { server 172.30.80.8:3000; keepalive 8; }
upstream staging_driver { server 172.30.80.5:3000; keepalive 8; }
upstream staging_kong { server 172.30.80.7:8000; keepalive 8; }

server { listen 127.0.0.1:80; server_name staging.fastpay.com.bo; client_max_body_size 20m;
 add_header X-Robots-Tag "noindex, nofollow" always;
 if ($http_cf_access_jwt_assertion = "") { return 403; }
 location = /realtime/v1/websocket {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_buffering off;
  proxy_pass http://staging_kong;
 }
 location / {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_buffering off;
  proxy_pass http://staging_customer_web;
 }
}

server { listen 127.0.0.1:80; server_name staging-driver.fastpay.com.bo; client_max_body_size 20m;
 add_header X-Robots-Tag "noindex, nofollow" always;
 if ($http_cf_access_jwt_assertion = "") { return 403; }
 location / {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_read_timeout 300s; proxy_send_timeout 300s; proxy_buffering off;
  proxy_pass http://staging_driver;
 }
}
